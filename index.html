<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>วิเคราะห์สัดส่วนใบหน้า</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14181f;--mut:#5b6573;--bd:#e3e6eb;--acc:#2563eb;--accfg:#fff;--ok:#15803d;--hi:#b45309;--lo:#6d28d9;--warn:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--fg:#e8ebf0;--mut:#98a2b3;--bd:#2a313b;--acc:#6ea0ff;--accfg:#0b1220;--ok:#4ade80;--hi:#fbbf24;--lo:#c4b5fd;--warn:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Noto Sans Thai","Sarabun",Tahoma,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 32px}
h1{font-size:20px;margin:0 0 12px}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:240px;display:flex;align-items:center;justify-content:center}
#cam,#shot{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;background:#000}
#cam{transform:scaleX(-1)}
[hidden]{display:none!important}
.oval{position:absolute;inset:8% 24%;border:2px dashed rgba(255,255,255,.55);border-radius:50%;pointer-events:none}
.msg{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:13px;color:#fff;background:rgba(0,0,0,.55);text-align:center}
#btn{display:block;width:100%;margin:12px 0;font:inherit;font-size:17px;font-weight:700;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--accfg);cursor:pointer}
#btn:disabled{opacity:.45;cursor:not-allowed}
#out{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.card h2{font-size:15px;margin:0 0 10px}
.note{font-size:12px;color:var(--mut);margin:10px 0 0}
.seg{display:flex;height:30px;border-radius:8px;overflow:hidden;margin-bottom:10px;gap:2px}
.seg span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.45);min-width:0}
.row{display:grid;grid-template-columns:10px 1fr auto 48px 64px;gap:8px;align-items:center;font-size:13.5px;padding:3px 0}
.row .dot{width:10px;height:10px;border-radius:50%}
.row .d{color:var(--mut);text-align:right}
.row b,.kv b{font-variant-numeric:tabular-nums}
.t{font-size:12px;text-align:right}
.t.ok{color:var(--ok)}.t.hi{color:var(--hi)}.t.lo{color:var(--lo)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--bd)}
.kv:last-of-type{border-bottom:0}
.kv b{text-align:right}
.kv small{color:var(--mut);display:block;font-weight:400}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px}
.foot{font-size:12px;color:var(--mut);margin-top:16px}
</style>
</head>
<body>
<main>
  <h1>วิเคราะห์สัดส่วนใบหน้า</h1>
  <div class="stage">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="shot" hidden></canvas>
    <div class="oval" id="oval"></div>
    <div class="msg" id="msg">กำลังโหลด…</div>
  </div>
  <button id="btn" disabled>ถ่ายภาพ</button>
  <section id="out"></section>
  <p class="foot">ประมวลผลในเบราว์เซอร์ รูปไม่ถูกส่งออกไปไหน · วัดเรขาคณิตของจุดบนภาพเท่านั้น ไม่ใช่คะแนนความสวยหรือการวินิจฉัยทางการแพทย์ · ค่า "อ้างอิง" เป็นแนวคิดเฉลี่ย ใบหน้าจริงเบี่ยงเบนได้ตามปกติ · ใช้ MediaPipe Face Landmarker</p>
</main>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const WASM  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

const f1 = n => Number.isFinite(n) ? n.toFixed(1) : '—';
const f2 = n => Number.isFinite(n) ? n.toFixed(2) : '—';
const sgn = n => Number.isFinite(n) ? (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(1) : '—';

// <measure>
const KEYS = ['tr','gl','sn','me','zr','zl','eRo','eRi','eLi','eLo'];
const PAIRS = [
  ['หางตา','eRo','eLo'], ['หัวตา','eRi','eLi'], ['คิ้วกลาง',105,334],
  ['ปีกจมูก',129,358], ['มุมปาก',61,291], ['มุมกราม',172,397], ['ขอบแก้ม','zr','zl']
];
function measure(lm, W, H, ov) {
  const raw = i => ({ x: lm[i].x * W, y: lm[i].y * H });
  const avg = (...a) => ({ x: a.reduce((s, p) => s + p.x, 0) / a.length, y: a.reduce((s, p) => s + p.y, 0) / a.length });
  const def = {
    tr: raw(10), gl: avg(raw(107), raw(336), raw(55), raw(285)), sn: raw(2), me: raw(152),
    zr: raw(234), zl: raw(454), eRo: raw(33), eRi: raw(133), eLi: raw(362), eLo: raw(263)
  };
  const N = {};
  for (const k of KEYS) N[k] = ov[k] || def[k];
  const get = k => typeof k === 'string' ? N[k] : raw(k);

  const dx = N.eLo.x - N.eRo.x, dy = N.eLo.y - N.eRo.y, len = Math.hypot(dx, dy) || 1;
  const U = { x: dx / len, y: dy / len }, V = { x: -U.y, y: U.x };
  const O = avg(N.eRi, N.eLi);
  const u = p => (p.x - O.x) * U.x + (p.y - O.y) * U.y;
  const v = p => (p.x - O.x) * V.x + (p.y - O.y) * V.y;
  const toImg = (a, b) => ({ x: O.x + a * U.x + b * V.x, y: O.y + a * U.y + b * V.y });

  const Wf = u(N.zl) - u(N.zr);

  const vt = [v(N.tr), v(N.gl), v(N.sn), v(N.me)];
  const th = [vt[1] - vt[0], vt[2] - vt[1], vt[3] - vt[2]];
  const thT = th[0] + th[1] + th[2];
  const thOk = th.every(x => x > 0);
  const thP = th.map(x => x / thT * 100);

  const ub = [u(N.zr), u(N.eRo), u(N.eRi), u(N.eLi), u(N.eLo), u(N.zl)];
  const fi = [];
  for (let i = 0; i < 5; i++) fi.push(ub[i + 1] - ub[i]);
  const fiOk = Wf > 0 && fi.every(x => x > 0);
  const fiP = fi.map(x => x / Wf * 100);
  const eyeW = (fi[1] + fi[3]) / 2, icd = fi[2];
  const eyeRatio = icd / eyeW;

  const Hface = vt[3] - vt[0];
  const ratioHW = Hface / Wf;
  const faceIndex = (vt[3] - v(raw(168))) / Wf * 100;

  const noseW = Math.abs(u(raw(129)) - u(raw(358)));
  const mouthW = Math.abs(u(raw(61)) - u(raw(291)));
  const rNoseIcd = noseW / icd, rMouthNose = mouthW / noseW;

  const sym = PAIRS.map(([name, a, b]) => {
    const pa = get(a), pb = get(b);
    const dR = -u(pa), dL = u(pb), mean = (dR + dL) / 2;
    const h = mean > 0 ? (dL - dR) / mean * 100 : NaN;
    const vv = (v(pb) - v(pa)) / Wf * 100;
    return { name, h, vv };
  });
  const hs = sym.map(s => Math.abs(s.h)).filter(Number.isFinite);
  const vs = sym.map(s => Math.abs(s.vv)).filter(Number.isFinite);
  const meanH = hs.length ? hs.reduce((a, b) => a + b, 0) / hs.length : NaN;
  const meanV = vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : NaN;
  const noseOff = u(N.sn) / Wf * 100, chinOff = u(N.me) / Wf * 100;

  const nose = u(raw(1));
  const yl = u(N.zl) - nose, yr = nose - u(N.zr);
  const yaw = Math.min(yl, yr) / Math.max(yl, yr);
  const roll = Math.atan2(dy, dx) * 180 / Math.PI;

  return { N, U, V, O, u, v, toImg, Wf, vt, th, thP, thOk, ub, fi, fiP, fiOk, eyeRatio,
           Hface, ratioHW, faceIndex, rNoseIcd, rMouthNose, sym, meanH, meanV, noseOff, chinOff, yaw, roll };
}
// </measure>

const $ = s => document.querySelector(s);
const cam = $('#cam'), shot = $('#shot'), btn = $('#btn'), msg = $('#msg'), out = $('#out'), oval = $('#oval');
let landmarker = null, stream = null, mode = 'live';
const setMsg = t => { msg.textContent = t; msg.hidden = !t; };

async function loadModel() {
  const fileset = await FilesetResolver.forVisionTasks(WASM);
  const make = delegate => FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: 'IMAGE', numFaces: 1
  });
  try { landmarker = await make('GPU'); } catch (e) { landmarker = await make('CPU'); }
}
async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false
  });
  cam.srcObject = stream;
  await cam.play();
}

async function init() {
  setMsg('กำลังโหลดโมเดลและเปิดกล้อง…');
  const results = await Promise.allSettled([loadModel(), startCamera()]);
  const [m, c] = results;
  if (m.status === 'rejected') { console.error(m.reason); setMsg('โหลดโมเดลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้า'); return; }
  if (c.status === 'rejected') {
    console.error(c.reason);
    const e = c.reason;
    setMsg(e && e.name === 'NotAllowedError' ? 'ยังไม่ได้อนุญาตให้ใช้กล้อง กรุณาอนุญาตแล้วรีเฟรชหน้า' : 'เปิดกล้องไม่ได้ (ต้องเปิดผ่าน https หรือ localhost)');
    return;
  }
  setMsg('จัดหน้าให้อยู่ในวงรี มองตรง หน้านิ่ง แล้วกดถ่ายภาพ');
  btn.disabled = false;
}

// ---------- capture ----------
btn.onclick = () => {
  if (mode === 'result') {           // ถ่ายใหม่
    shot.hidden = true; cam.hidden = false; oval.hidden = false;
    cam.play(); out.innerHTML = ''; btn.textContent = 'ถ่ายภาพ'; mode = 'live';
    setMsg('จัดหน้าให้อยู่ในวงรี มองตรง หน้านิ่ง แล้วกดถ่ายภาพ');
    return;
  }
  const w = cam.videoWidth, h = cam.videoHeight;
  if (!w) return;
  shot.width = w; shot.height = h;
  const c = shot.getContext('2d');
  c.save(); c.translate(w, 0); c.scale(-1, 1); c.drawImage(cam, 0, 0, w, h); c.restore();
  cam.pause();
  cam.hidden = true; shot.hidden = false; oval.hidden = true;
  mode = 'result'; btn.textContent = 'ถ่ายใหม่'; setMsg('');

  let lm = null;
  try { lm = landmarker.detect(shot).faceLandmarks[0] || null; } catch (e) { console.error(e); }
  if (!lm) { out.innerHTML = `<div class="warnbox">ไม่พบใบหน้า กด "ถ่ายใหม่" แล้วให้เห็นหน้าตรงและชัดขึ้น</div>`; return; }
  const M = measure(lm, w, h, {});
  drawGuides(c, M, w, h);
  renderResults(M);
};

function drawGuides(c, M, w, h) {
  const r = shot.getBoundingClientRect();
  const k = 1 / (Math.min(r.width / w, r.height / h) || 1);
  const lw = Math.max(1, 1.6 * k), fs = 13 * k;
  const line = (a, b, col, dash) => {
    c.save(); c.lineCap = 'round'; c.setLineDash(dash || []);
    c.lineWidth = lw + 2 * k; c.strokeStyle = 'rgba(0,0,0,.45)';
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    c.lineWidth = lw; c.strokeStyle = col; c.stroke(); c.restore();
  };
  const text = (t, p, col, align) => {
    c.save(); c.font = `600 ${fs}px system-ui,sans-serif`;
    c.textAlign = align || 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
    c.lineWidth = 3 * k; c.strokeStyle = 'rgba(0,0,0,.65)'; c.strokeText(t, p.x, p.y);
    c.fillStyle = col; c.fillText(t, p.x, p.y); c.restore();
  };
  const AMB = '#f5a524', TEAL = '#2dd4bf', PINK = '#f472b6';
  const { toImg, ub, vt, Wf } = M, pad = 0.12 * Wf;
  for (const y of vt) line(toImg(ub[0] - pad, y), toImg(ub[5] + pad, y), AMB);
  for (const x of ub) line(toImg(x, vt[0]), toImg(x, vt[3]), TEAL);
  line(toImg(0, vt[0] - 0.06 * Wf), toImg(0, vt[3] + 0.06 * Wf), PINK, [8 * k, 6 * k]);
  if (M.thOk) for (let i = 0; i < 3; i++) text(f1(M.thP[i]) + '%', toImg(ub[5] + pad * 0.15, (vt[i] + vt[i + 1]) / 2), AMB, 'left');
  if (M.fiOk) for (let i = 0; i < 5; i++) {
    const p = toImg((ub[i] + ub[i + 1]) / 2, vt[0] - 0.05 * Wf);
    p.y = Math.max(fs, p.y);
    text(f1(M.fiP[i]) + '%', p, TEAL);
  }
}

// ---------- results ----------
const card = (title, body, note) => `<article class="card"><h2>${title}</h2>${body}${note ? `<p class="note">${note}</p>` : ''}</article>`;
const kv = (k, v, sub) => `<div class="kv"><span>${k}${sub ? `<small>${sub}</small>` : ''}</span><b>${v}</b></div>`;
function tag(d, words) {
  if (Math.abs(d) <= 3) return ['ใกล้เคียง', 'ok'];
  return d > 0 ? [words[0], 'hi'] : [words[1], 'lo'];
}
function segs(items, ideal, words) {
  const bar = '<div class="seg">' + items.map(i => `<span style="flex:${Math.max(i.pct, 0.1)};background:${i.c}">${f1(i.pct)}</span>`).join('') + '</div>';
  const rows = items.map(i => {
    const d = i.pct - ideal, [t, kls] = tag(d, words);
    return `<div class="row"><span class="dot" style="background:${i.c}"></span><span>${i.l}</span><b>${f1(i.pct)}%</b><span class="d">${sgn(d)}</span><span class="t ${kls}">${t}</span></div>`;
  }).join('');
  return bar + rows;
}

function renderResults(M) {
  const A = '#d98a0b', B = '#e0a21f', C = '#c27a00', T1 = '#0d9488', T2 = '#14b8a6', T3 = '#0f766e';
  let h = '';
  if (M.yaw < 0.85) h += `<div class="warnbox">ใบหน้าหันเฉียง ค่าสมมาตรและห้าส่วนอาจเพี้ยน ลองถ่ายหน้าตรงใหม่</div>`;

  h += card('สามส่วนแนวตั้ง', M.thOk
    ? segs([
        { l: 'บน (ขอบบน–คิ้ว)', pct: M.thP[0], c: A },
        { l: 'กลาง (คิ้ว–ฐานจมูก)', pct: M.thP[1], c: B },
        { l: 'ล่าง (ฐานจมูก–คาง)', pct: M.thP[2], c: C }
      ], 100 / 3, ['ยาวกว่า', 'สั้นกว่า'])
    : '<div class="warnbox">คำนวณไม่ได้ ลองถ่ายใหม่</div>',
    'อ้างอิง 33.3% ต่อส่วน · ขอบบนคือขอบบนโครงหน้าจากโมเดล ไม่ใช่ไรผมจริง ส่วนบนจึงอาจสั้นกว่าความเป็นจริง');

  h += card('ห้าส่วนแนวนอน', M.fiOk
    ? segs([
        { l: 'ขอบแก้ม–หางตา', pct: M.fiP[0], c: T1 },
        { l: 'ตาข้างที่ 1', pct: M.fiP[1], c: T2 },
        { l: 'ระหว่างตา', pct: M.fiP[2], c: T3 },
        { l: 'ตาข้างที่ 2', pct: M.fiP[3], c: T2 },
        { l: 'หางตา–ขอบแก้ม', pct: M.fiP[4], c: T1 }
      ], 20, ['กว้างกว่า', 'แคบกว่า']) + kv('ระยะระหว่างหัวตา ÷ ความกว้างตา', f2(M.eyeRatio), 'อ้างอิง ≈ 1.00')
    : '<div class="warnbox">คำนวณไม่ได้ ลองถ่ายใหม่</div>',
    'อ้างอิง 20% ต่อส่วน ใช้ขอบแก้มแทนหู ส่วนนอกสองส่วนจึงมักต่ำกว่า 20%');

  const cls = M.faceIndex < 84 ? 'หน้ากว้าง' : M.faceIndex <= 88 ? 'ขนาดกลาง' : 'หน้ายาว';
  h += card('อัตราส่วนใบหน้',
    kv('ดัชนีใบหน้า (หัวคิ้ว–คาง ÷ กว้าง × 100)', f1(M.faceIndex), `ช่วงกลางทางคลินิก 84–88 · ผลนี้: ${cls}`) +
    kv('สูง (ขอบบน–คาง) ÷ กว้าง', f2(M.ratioHW), '1.618 เป็นแค่ค่าอ้างอิงยอดนิยม'),
    'เป็นค่าประมาณจากจุดบนภาพ ไม่ใช่การวัดกะโหลกจริง');

  h += card('ความสมมาตรซ้าย–ขวา',
    kv('ระยะจากเส้นกลาง ต่างเฉลี่ย', f1(M.meanH) + '%') +
    kv('ระดับสูง–ต่ำ ต่างเฉลี่ย', f1(M.meanV) + '%') +
    kv('จมูกเบี่ยงจากเส้นกลางตา', sgn(M.noseOff) + '%', '+ = เบี่ยงไปทางขวาของภาพ') +
    kv('คางเบี่ยงจากเส้นกลางตา', sgn(M.chinOff) + '%'),
    'ทุกใบหน้าไม่สมมาตรสมบูรณ์ ต่างกันไม่กี่ % เป็นเรื่องปกติ');

  out.innerHTML = h;
}

init();
</script>
</body>
</html>
